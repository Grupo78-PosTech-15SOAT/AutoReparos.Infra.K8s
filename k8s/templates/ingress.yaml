{{- if and .Values.ingress.enabled .Values.web.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autoreparos-web-ingress
  labels:
    app.kubernetes.io/name: autoreparos-web
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    alb.ingress.kubernetes.io/group.name: autoreparos-internal
    # Maior ordem do grupo: o catch-all "/" do Web casa por último, depois das regras de OS (10), Cobrança (20),
    # Execução (30) e Cadastros (100), que ficam nos charts de cada serviço.
    alb.ingress.kubernetes.io/group.order: "1000"
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200-399"
spec:
  ingressClassName: {{ .Values.ingress.className | default "alb" }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: autoreparos-web
                port:
                  number: 80
{{- end }}
