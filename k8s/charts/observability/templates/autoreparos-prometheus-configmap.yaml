apiVersion: v1
kind: ConfigMap
metadata:
  name: autoreparos-prometheus-config
  labels:
    {{- include "observability.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['autoreparos-otel-collector:8889']
