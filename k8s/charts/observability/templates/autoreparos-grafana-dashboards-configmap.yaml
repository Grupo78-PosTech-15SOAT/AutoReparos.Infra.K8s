apiVersion: v1
kind: ConfigMap
metadata:
  name: autoreparos-grafana-dashboards-config
  labels:
    {{- include "observability.labels" . | nindent 4 }}
data:
  dotnet_api_overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "title": "Taxa de Requisições (RPS, média 5m)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(autoreparos_http_server_request_duration_seconds_count[5m]))",
              "legendFormat": "Req/sec",
              "range": true,
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "title": "Latência Média (ms, janela 5m)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(autoreparos_http_server_request_duration_seconds_sum[5m])) / clamp_min(sum(rate(autoreparos_http_server_request_duration_seconds_count[5m])), 0.001) * 1000",
              "legendFormat": "ms",
              "range": true,
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "title": "Consumo de Memória (Process)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "autoreparos_dotnet_process_memory_working_set_bytes / 1024 / 1024",
              "legendFormat": "MB",
              "range": true,
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "title": "Erros HTTP 5xx (taxa 5m)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(autoreparos_http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[5m])) or vector(0)",
              "legendFormat": "5xx/sec",
              "range": true,
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "id": 5,
          "title": "Distribuição de Requisições por Rota HTTP",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "sum by (http_route, http_request_method) (rate(autoreparos_http_server_request_duration_seconds_count[5m]))",
              "legendFormat": "{{ "{{" }}http_request_method}} {{ "{{" }}http_route}}",
              "range": true,
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "id": 6,
          "title": "Logs da Aplicação (Loki)",
          "type": "logs",
          "datasource": { "type": "loki", "uid": "Loki" },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "Loki" },
              "editorMode": "code",
              "expr": "{service_name=~\"autoreparos-api|AutoReparos.API\"}",
              "refId": "A"
            }
          ]

        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["autoreparos", "dotnet", "opentelemetry"],
      "time": { "from": "now-15m", "to": "now" },
      "timezone": "browser",
      "title": "AutoReparos .NET 10 API Overview",
      "uid": "autoreparos-dotnet-overview"
    }
