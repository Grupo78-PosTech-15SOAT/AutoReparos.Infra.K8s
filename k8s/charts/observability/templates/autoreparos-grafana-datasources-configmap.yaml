apiVersion: v1
kind: ConfigMap
metadata:
  name: autoreparos-grafana-datasources-config
  labels:
    {{- include "observability.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false

      - name: Jaeger
        uid: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        editable: false

      - name: Loki
        uid: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        editable: false
