apiVersion: v1
kind: Service
metadata:
  name: autoreparos-jaeger
  labels:
    app: autoreparos-jaeger
    {{- include "observability.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: autoreparos-jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: ui
      port: 16686
      targetPort: 16686
