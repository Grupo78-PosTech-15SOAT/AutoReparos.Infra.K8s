apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoreparos-otel-collector
  labels:
    app: autoreparos-otel-collector
    {{- include "observability.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.otelCollector.replicaCount }}
  selector:
    matchLabels:
      app: autoreparos-otel-collector
  template:
    metadata:
      labels:
        app: autoreparos-otel-collector
    spec:
      containers:
        - name: autoreparos-otel-collector
          image: "{{ .Values.otelCollector.image.repository }}:{{ .Values.otelCollector.image.tag }}"
          args: ["--config=/etc/autoreparos-otel-collector-config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 8889
            - name: healthz
              containerPort: 13133
          livenessProbe:
            httpGet:
              path: /
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.otelCollector.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/autoreparos-otel-collector-config.yaml
              subPath: autoreparos-otel-collector-config.yaml
      volumes:
        - name: config
          configMap:
            name: autoreparos-otel-collector-config

