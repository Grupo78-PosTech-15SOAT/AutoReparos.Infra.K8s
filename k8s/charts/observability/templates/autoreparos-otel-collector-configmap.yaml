apiVersion: v1
kind: ConfigMap
metadata:
  name: autoreparos-otel-collector-config
  labels:
    {{- include "observability.labels" . | nindent 4 }}
data:
  autoreparos-otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        send_batch_size: 8192
        timeout: 1s
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20

    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: "autoreparos"

      otlp/jaeger:
        endpoint: autoreparos-jaeger:4317
        tls:
          insecure: true

      loki:
        endpoint: http://autoreparos-loki:3100/loki/api/v1/push

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/jaeger]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [loki]
