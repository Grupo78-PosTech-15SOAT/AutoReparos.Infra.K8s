otelCollector:
  enabled: true
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.96.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  # Exportacao adicional para backend de observabilidade em nuvem.
  # Quando habilitado, os sinais seguem para o stack local E para o vendor.
  # New Relic: endpoint otlp.nr-data.net:4317   / header api-key
  # Datadog:   endpoint https://otlp.datadoghq.com:4317 / header dd-api-key
  vendor:
    enabled: false
    endpoint: "otlp.nr-data.net:4317"
    apiKeyHeader: "api-key"
    # Secret do Kubernetes que guarda a license key (nao versionar a chave no chart).
    existingSecret: "autoreparos-otel-vendor"
    existingSecretKey: "license-key"

prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: "v2.51.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

jaeger:
  enabled: true
  image:
    repository: jaegertracing/all-in-one
    tag: "1.55"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

loki:
  enabled: true
  image:
    repository: grafana/loki
    tag: "2.9.5"
  resources:
    requests:
      cpu: 100m
