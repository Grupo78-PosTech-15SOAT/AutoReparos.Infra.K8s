otelCollector:
  enabled: true
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.96.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: "v2.51.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

jaeger:
  enabled: true
  image:
    repository: jaegertracing/all-in-one
    tag: "1.55"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

loki:
  enabled: true
  image:
    repository: grafana/loki
    tag: "2.9.5"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "10.4.1"
  adminUser: "admin"
  adminPassword: "admin123Password!"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
