{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api.fullname" . }}-secrets
  labels:
    {{- include "api.labels" . | nindent 4 }}
type: Opaque
data:
  ConnectionStrings__DbConnection: {{ .Values.secrets.dbConnection | default (printf "Host=%s-database-service;Port=5432;Database=autoreparos;Username=admin;Password=%s;SSL Mode=Disable;" .Release.Name (.Values.secrets.seedUserPassword | default "admin")) | b64enc | quote }}
  Jwt__Secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  SeedUser__Password: {{ .Values.secrets.seedUserPassword | b64enc | quote }}
  AprovacaoToken__Secret: {{ .Values.secrets.aprovacaoTokenSecret | b64enc | quote }}
  SendGrid__ApiKey: {{ .Values.secrets.sendGridApiKey | b64enc | quote }}
{{- end }}
