replicaCount: 1

image:
  repository: autoreparos-api
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

telemetry:
  serviceName: autoreparos-api
  environment: production
  otlpEndpoint: http://autoreparos-otel-collector:4317

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix

config:
  aspnetcoreEnvironment: "Development"
  jwtExpiryHours: "2"
  seedUserEmail: "admin@autoreparos.com"
  sendGridFromEmail: "noreply@autoreparos.com"
  sendGridFromName: "AutoReparos"

database:
  skipStartupMigration: false

secrets:
  create: false
  dbConnection: ""
  jwtSecret: ""
  seedUserPassword: ""
  aprovacaoTokenSecret: ""
  sendGridApiKey: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

hpa:
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
