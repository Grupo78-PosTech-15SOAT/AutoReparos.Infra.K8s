apiVersion: v2
name: k8s
description: Umbrella Helm Chart para a plataforma AutoReparos (Web, Banco de Dados local e Observabilidade; cada serviço tem o próprio chart)
type: application
version: 1.0.0
appVersion: "1.0.0"

dependencies:
  - name: database
    version: 1.0.0
    repository: "file://charts/database"
    condition: database.enabled
  - name: web
    version: 1.0.0
    repository: "file://charts/web"
  - name: observability
    version: 1.0.0
    repository: "file://charts/observability"
