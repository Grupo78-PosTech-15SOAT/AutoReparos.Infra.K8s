ingress:
  enabled: true
  className: alb

database:
  enabled: true
  image: postgres:16
  database: autoreparos
  user: admin
  password: ""
  storageSize: 2Gi
  persistence:
    enabled: true
    storageClass: "hostpath"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

web:
  # Local (docker/kind) o guarda-chuva sobe o Web; em produção o Web tem release próprio no namespace web (D-72).
  enabled: true
  replicaCount: 1
  image:
    repository: autoreparos-web
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
  config:
    apiUrl: ""
    otelCollectorHost: "autoreparos-otel-collector"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

observability:
  enabled: true
