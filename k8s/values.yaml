api:
  replicaCount: 1
  image:
    repository: autoreparos-api
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
  config:
    aspnetcoreEnvironment: "Development"
    jwtExpiryHours: "2"
    seedUserEmail: "admin@autoreparos.com"
    sendGridFromEmail: "noreply@autoreparos.com"
    sendGridFromName: "AutoReparos"
  secrets:
    jwtSecret: ""
    seedUserPassword: ""
    aprovacaoTokenSecret: ""
    sendGridApiKey: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

database:
  image: postgres:16
  database: autoreparos
  user: admin
  password: ""
  storageSize: 2Gi
  persistence:
    enabled: true
    storageClass: "hostpath"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

web:
  replicaCount: 1
  image:
    repository: autoreparos-web
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

observability:
  enabled: true
