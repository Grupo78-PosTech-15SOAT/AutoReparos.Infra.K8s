ingress:
  enabled: true
  className: alb

api:
  replicaCount: 1
  image:
    repository: autoreparos-api
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
    className: nginx
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
  config:
    aspnetcoreEnvironment: "Development"
    jwtExpiryHours: "2"
    jwtIssuer: ""  # URL pública do Cadastros (iss do JWT e issuer do discovery OIDC); definido pelo CI/CD
    seedUserEmail: "admin@autoreparos.com"
    sendGridFromEmail: "noreply@autoreparos.com"
    sendGridFromName: "AutoReparos"
    notificacoesFilaUrl: ""  # fila SQS própria do Cadastros (vazia desliga o consumidor)
    notificacoesDlqUrl: ""  # DLQ própria do Cadastros
  secrets:
    create: false
    dbConnection: ""
    jwtChavePrivadaPem: ""  # chave RSA PKCS#8 em PEM; Secret do K8s
    chaveInterna: ""  # segredo de X-Chave-Interna; Secret do K8s
    seedUserPassword: ""
    sendGridApiKey: ""
  networkPolicy:
    enabled: true
    # Origens autorizadas a chegar nos pods do Cadastros (negação por padrão para o resto)
    ingressNamespaces: ["ingress-nginx", "kube-system"]  # controladores de entrada / AWS Load Balancer Controller
    allowedCidrs: []  # CIDRs das subnets privadas da VPC (ALB interno e Lambda); definido pelo CI/CD

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

database:
  enabled: true
  image: postgres:16
  database: autoreparos
  user: admin
  password: ""
  storageSize: 2Gi
  persistence:
    enabled: true
    storageClass: "hostpath"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

web:
  replicaCount: 1
  image:
    repository: autoreparos-web
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
  config:
    apiUrl: ""
    otelCollectorHost: "autoreparos-otel-collector"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

observability:
  enabled: true
