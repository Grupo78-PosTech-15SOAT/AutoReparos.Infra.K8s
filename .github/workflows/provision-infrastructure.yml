name: Provisionar Infraestrutura AWS

on:
  workflow_dispatch:
    inputs: {}

permissions:
  contents: read

concurrency:
  group: terraform-infrastructure-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: true

jobs:
  terraform:
    name: Planejar e provisionar recursos AWS
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@e3ddf14f329da44ef5b750c8fb86e6b66ad4ce60 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.8.0

      - name: Instalar kubectl e Helm
        run: |
          curl -fsSL https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl -o /usr/local/bin/kubectl
          chmod +x /usr/local/bin/kubectl
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Inicializar Terraform
        run: terraform init

      - name: Aplicar somente a base AWS para habilitar acesso ao EKS
        run: >-
          terraform apply -auto-approve
          -target=module.vpc
          -target=module.eks
          -target=module.ecr

      - name: Configurar kubeconfig para os providers Kubernetes e Helm
        run: aws eks update-kubeconfig --name autoreparos-cluster --region "$AWS_REGION"

      - name: Gerar plano completo
        run: terraform plan -out=tfplan

      - name: Disponibilizar plano como artefato
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terraform-plan-${{ github.run_id }}
          path: terraform/tfplan
          if-no-files-found: error
          retention-days: 1

      - name: Aplicar plano Terraform
        run: terraform apply -auto-approve tfplan
