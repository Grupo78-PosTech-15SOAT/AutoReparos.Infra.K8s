name: CI - AutoReparos.Infra.K8s

on:
  push:
    branches: [main, develop]
    paths: ['terraform/**', 'k8s/**', 'bootstrap/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [main, develop]
    paths: ['terraform/**', 'k8s/**', 'bootstrap/**', '.github/workflows/ci.yml']

permissions:
  contents: read

concurrency:
  group: k8s-iac-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
      - uses: azure/setup-helm@fe7b1b4506d7105c267c2c78d0c8f18f8c4c0484 # v4.2.0
        with:
          version: v3.16.4
      - name: Validate every Terraform root without AWS credentials
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' dir; do
            terraform -chdir="$dir" fmt -check -recursive
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
          done < <(find terraform bootstrap -type f -name '*.tf' -not -path '*/.terraform/*' -printf '%h\0' | sort -zu)
      - name: Lint and render charts
        run: |
          helm lint k8s/
          helm template autoreparos k8s/ --namespace autoreparos -f k8s/values-production.yaml
          for chart in k8s/charts/*; do
            helm lint "$chart"
            helm template autoreparos "$chart" --namespace autoreparos
          done
