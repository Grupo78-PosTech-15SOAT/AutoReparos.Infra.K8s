name: CI/CD - AutoReparos.Infra.K8s

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'terraform/**'
      - 'k8s/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'terraform/**'
      - 'k8s/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "CONFIRMAR-APPLY" para autorizar o provisionamento do cluster EKS e VPC'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  validate-terraform:
    name: Validação Sintática IaC (Terraform)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: terraform fmt -check -diff -recursive

      - name: Terraform Init (no backend)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  lint-helm:
    name: Validação Helm Charts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm Chart
        run: helm lint k8s/

  plan:
    name: Terraform Plan
    needs: [validate-terraform, lint-helm]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Validar Configuração OIDC
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "::error::Secret AWS_ROLE_ARN não configurado. Autenticação GitHub Actions OIDC requer a ARN da IAM Role configurada."
            exit 1
          fi

      - name: Configurar Credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Terraform Init (Backend Remoto S3)
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan

      - name: Terraform Apply (Apenas sob Confirmação Explícita)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'CONFIRMAR-APPLY'
        run: terraform apply -auto-approve tfplan
