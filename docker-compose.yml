# Docker Compose - AutoReparos.Infra.K8s (Local Observability & Gateway Testing)
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: autoreparos-k8s-otel-collector
    restart: always
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics exporter
    depends_on:
      - prometheus
      - jaeger
      - loki
    networks:
      - autoreparos-k8s-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: autoreparos-k8s-prometheus
    restart: always
    ports:
      - "9090:9090"
    networks:
      - autoreparos-k8s-network

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: autoreparos-k8s-jaeger
    restart: always
    ports:
      - "16686:16686" # UI
    networks:
      - autoreparos-k8s-network

  loki:
    image: grafana/loki:2.9.5
    container_name: autoreparos-k8s-loki
    restart: always
    ports:
      - "3100:3100"
    networks:
      - autoreparos-k8s-network

  grafana:
    image: grafana/grafana:10.4.1
    container_name: autoreparos-k8s-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
      - loki
    networks:
      - autoreparos-k8s-network

networks:
  autoreparos-k8s-network:
    driver: bridge
